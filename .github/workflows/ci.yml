name: RolegacyAI Website CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - i18n-zh

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      BASE_PATH: "/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
